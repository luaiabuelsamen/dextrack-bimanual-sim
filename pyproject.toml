[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oppdef"
version = "0.1.0"
description = "Opposition deficit: what a robot hand cannot oppose, and what to retarget instead"
requires-python = ">=3.10"
dependencies = ["mujoco>=3.8", "numpy", "scipy"]

[project.optional-dependencies]
gpu = ["warp-lang>=1.16", "mujoco-warp"]
learn = ["torch"]
viz = ["imageio", "matplotlib"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
  "slow: runs physics for more than a few seconds",
  "gpu: needs warp and a CUDA device",
]

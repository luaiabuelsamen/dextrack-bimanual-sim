name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: install
        run: |
          python -m pip install -U pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,viz]" trimesh rtree
      - name: hand models
        run: make vendor
      - name: compile
        run: python -m compileall -q src experiments dextrack tests
      - name: probe tests
        run: PYTHONPATH=src:. python -m pytest -q tests/test_probe.py
      - name: fast invariants
        run: make test-fast
